name: build

# 每次推送：Linux 与 macOS 上跑单元测试；分支打包本机架构并跑精简启动集、同步测试（20 分钟上限）。
# main 打包通用版、跑全量启动/更新测试与截图，另打 App Store 沙盒版。上传用 app-store.yml（手动运行）。
# 推到 main 且都通过后，看 CHANGELOG.md 最上面的版本有没有发布过，没有就用 Frit 的发布流程发布（见最后的 release）。
# 不用 pull_request 触发：合并请求显示的就是它分支上这次推送的结果；两个都开的话同一个提交要跑两遍，
# macOS runner 排队的时间也翻倍（[screenshots] 也只在推送时才有提交信息可看）。
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# 同一分支上新的推送会取消还在跑的旧构建；main 上不取消，免得发版做到一半被打断。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Localization
        # 英文和简体中文的翻译表键一致，代码里用到的键都有翻译，没有漏掉 L() 的中文。
        run: |
          command -v python3 > /dev/null || (apt-get update -qq && apt-get install -y -qq python3 > /dev/null)
          python3 scripts/check-localization.py
      - name: App Store listing
        # docs/app-store/listing 里的 App Store 资料：文件齐全、没超字数、网址是 https、截图尺寸对；
        # 以及把资料填进 App Store Connect 的脚本的单元测试（JWT 签名的测试要用 openssl 命令）。
        run: |
          command -v openssl > /dev/null || (apt-get update -qq && apt-get install -y -qq openssl > /dev/null)
          python3 scripts/app-store-connect.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Unit tests
        id: unit-tests
        shell: bash
        run: swift test 2>&1 | tee "$RUNNER_TEMP/stox-unit-tests.log"
      - name: Unit test failure details
        if: failure() && steps.unit-tests.outcome == 'failure'
        # 网络受限的开发环境未必能下载 Actions 日志；保留具体编译/断言错误供 API 读取。
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "stox-unit-tests.log").read_text().splitlines()
          failures = [line for line in lines if "error:" in line or " failed" in line]
          for line in failures[:40]:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Unit test failure::{message}")
          PY
      - name: Live data smoke test
        if: github.ref == 'refs/heads/main'
        id: live-data-0
        # 真实请求腾讯行情接口和 GitHub 的发布接口；偶尔抖动时不阻塞构建。
        continue-on-error: true
        run: |
          swift run stox-cli quote sh000001 sh600519 sz000001 sz399006 sh510300 bj920819 hk00700 hkHSI usAAPL usBRK.B us.IXIC hf_XAU whUSDCNY
          swift run stox-cli quote us.INX us.DJI usMSFT usNVDA hk00005 hkHSCEI whEURUSD
          swift run stox-cli quote znb_NKY znb_UKX znb_DAX znb_CAC znb_SX5E znb_KOSPI znb_SENSEX znb_TWJQ znb_STI znb_IBOV
          swift run stox-cli search gzmt
          swift run stox-cli search 黄金
          swift run stox-cli search nikkei
          swift run stox-cli search 腾讯
          swift run stox-cli kline sh600519 day
          swift run stox-cli kline hk00700 week
          swift run stox-cli kline usAAPL month
          swift run stox-cli book sh600519
          swift run stox-cli rank gainers 5
          swift run stox-cli rank industries 5
          swift run stox-cli flow sh600519
          swift run stox-cli sina sh000001 sh600519 sh510300 hk00700 hkHSI usAAPL usBRK.B us.IXIC znb_NKY
          swift run stox-cli latest-release 0.0.1

      - name: Warn about live data failures
        if: always() && steps.live-data-0.outcome == 'failure'
        run: echo '::warning::真实行情接口冒烟失败；构建继续，请检查 Live data smoke test 日志。'


  app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 45 || 20 }}
    env:
      STOX_E2E_SCREENSHOTS: ${{ (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[screenshots')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        id: toolchain
        # 用 runner 上最新的正式版 Xcode：用 Xcode 26 编译时，面板在 macOS 26 上会换成系统的 Liquid Glass。
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv -e beta -e release_candidate -e '_rc' | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version
          echo "cache-key=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "::notice title=toolchain::$(xcodebuild -version | head -1), $(swift --version 2>&1 | head -1)"
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift') }}-
      - name: Unit tests
        id: unit-tests
        shell: bash
        run: swift test 2>&1 | tee "$RUNNER_TEMP/stox-unit-tests.log"
      - name: Unit test failure details
        if: failure() && steps.unit-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "stox-unit-tests.log").read_text().splitlines()
          failures = [line for line in lines if "error:" in line or " failed" in line]
          for line in failures[:40]:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Unit test failure::{message}")
          PY
      - name: Build Stox.app
        env:
          UNIVERSAL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: ./scripts/build-app.sh
      - name: Inspect bundle
        run: |
          plutil -p dist/Stox.app/Contents/Info.plist
          ls -la dist/Stox.app/Contents/MacOS dist/Stox.app/Contents/Resources
          plutil -lint dist/Stox.app/Contents/Resources/*.lproj/*.strings
          codesign --verify --deep --strict --verbose=2 dist/Stox.app
      - name: Launch smoke test
        # 分支跑八个中英文面板、详情、搜索、设置用例；main 跑包含更多功能和截图的全量。
        run: scripts/ci-e2e.sh ${{ github.ref == 'refs/heads/main' && 'smoke' || 'quick' }}
      - name: iCloud sync test
        # 用一个假的 iCloud 云盘文件夹走一遍同步：启动时拉取、运行中收到改动、文件被删后写回。
        run: scripts/ci-e2e.sh sync
      - name: One-click update test
        if: github.ref == 'refs/heads/main'
        # 本地假发布 9.9.9：发现新版本、下载校验替换并重新启动，以及从临时位置运行时装进“应用程序”。
        run: scripts/ci-e2e.sh update
      - name: Crop screenshots
        if: always() && env.STOX_E2E_SCREENSHOTS == '1'
        continue-on-error: true
        run: |
          swiftc -O scripts/ci-screenshot.swift -o "$RUNNER_TEMP/crop"
          for log in shots/*.log; do
            name=$(basename "$log" .log)
            [ -f "shots/$name-full.png" ] || continue
            # 取最后一次报的范围：晚几秒再报的那次，面板已经按慢到的内容调整好了，和截图时一致。
            frame=$(grep -o 'capture_frame=[0-9 -]*' "$log" | tail -1 | cut -d= -f2)
            [ -n "$frame" ] || continue
            "$RUNNER_TEMP/crop" "shots/$name-full.png" "shots/$name.jpg" $frame 900 0.85
            "$RUNNER_TEMP/crop" "shots/$name-full.png" "shots/$name-preview.jpg" $frame 640 0.45
          done
          ls -la shots
      - uses: actions/upload-artifact@v5
        if: always()
        # 截图只是辅助诊断，GitHub 的产物服务偶尔超时，不能因为它让整次构建失败。
        continue-on-error: true
        with:
          name: screenshots
          path: shots/
      # 提交信息里带 [screenshots] 时，把诊断信息和截图以注释形式发布，方便在无法下载构建产物的环境里
      # 通过 API 取回查看。[screenshots: panel settings-display] 这样可以指定要哪几张。
      - name: Pick screenshots
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          names=$(printf '%s\n' "$MESSAGE" | grep -o '\[screenshots[^]]*\]' | head -1 | sed -e 's/^\[screenshots:*//' -e 's/\]$//' | tr ',' ' ')
          if [ -z "$(echo $names)" ]; then
            names="panel settings-display"
          fi
          echo $names | tee shots/annotate.txt
      - name: Diagnostics as annotations
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: |
          grep -h "status_title\|footprint\|panel_frame\|whatsnew\|late us_phase" shots/panel.log shots/panel-memory.log shots/tips.log shots/holdings.log 2>/dev/null | head -14 | while read -r line; do
            echo "::notice title=diag::$line"
          done
      - name: Screenshot annotations (1)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 1
      - name: Screenshot annotations (2)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 2
      - name: Screenshot annotations (3)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 3
      - name: Screenshot annotations (4)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 4
      - name: Live data smoke test
        if: github.ref == 'refs/heads/main'
        id: live-data-1
        continue-on-error: true
        run: swift run -c release stox-cli quote sh600519 hk00700 usAAPL us.IXIC
      - name: Warn about live data failures
        if: always() && steps.live-data-1.outcome == 'failure'
        run: echo '::warning::真实行情接口冒烟失败；构建继续，请检查 Live data smoke test 日志。'

      - name: Package
        # 一键更新靠 SHA256SUMS.txt 校验下载的压缩包，发布时和 Stox.zip 一起上传。
        run: |
          cd dist
          ditto -c -k --keepParent Stox.app Stox.zip
          shasum -a 256 Stox.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: Stox-app
          path: |
            dist/Stox.zip
            dist/SHA256SUMS.txt

  appstore:
    name: App Store edition (sandbox)
    if: github.ref == 'refs/heads/main'
    # App Store 版：ad-hoc 签名、带沙盒 entitlement（不需要证书），在沙盒里启动一遍，确认取得到行情、面板打得开、
    # 同步文件写得进去、没有一键更新的代码，顺便做 App Store 尺寸的截图。和上面的 macOS app 并行，不拖慢它。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv -e beta -e release_candidate -e '_rc' | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
      - name: Build App Store edition (ad-hoc, sandboxed)
        run: ADHOC=1 scripts/build-app-store.sh
      - name: Inspect bundle
        run: |
          plutil -p dist/appstore/Stox.app/Contents/Info.plist
          codesign -d --entitlements - dist/appstore/Stox.app
          lipo -info dist/appstore/Stox.app/Contents/MacOS/Stox
          pkgutil --payload-files dist/Stox-AppStore.pkg | head -20
      - name: Sandbox launch test
        run: scripts/ci-e2e.sh appstore
      - name: App Store screenshots
        # 商店截图：英文界面的五个场景（菜单栏、K 线、持仓、环球市场、盈亏日历），持仓和盈亏记录都是编的，
        # 合成 1280x800 的 shots/app-store/1-menu-bar.png … 5-calendar.png，再按 App Store 的要求检查尺寸和张数。
        # app-store.yml 上架时用 main 上最近一次成功的 build 里的这几张（app-store-screenshots）。
        # 行情接口偶尔取不到时这一步会失败，不挡住发版：五张都截好了才放进 shots/app-store，失败时上架就不动商店里的截图。
        if: always()
        continue-on-error: true
        run: |
          scripts/ci-e2e.sh appstore-shots
          python3 scripts/app-store-connect.py check --screenshots shots/app-store
      - uses: actions/upload-artifact@v5
        if: always()
        continue-on-error: true
        with:
          name: app-store-screenshots
          path: shots/
      # 提交信息里带 [screenshots] 时，把五张商店截图缩成 560 宽的 JPEG，以注释形式发布，和上面的 macOS app 一样可以通过 API 取回。
      # 一个任务最多 50 条注释：五张一共不超过 40 段，压不下来就降低质量。
      - name: Pick App Store screenshots
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: |
          dir=shots/app-store-previews
          rm -rf "$dir"
          mkdir -p "$dir"
          names=$(cd shots/app-store && ls *.png | sed 's/\.png$//')
          echo $names | tee "$dir/annotate.txt"
          for quality in 45 40 35 30 25; do
            chunks=0
            for name in $names; do
              sips -s format jpeg -s formatOptions "$quality" --resampleWidth 560 "shots/app-store/$name.png" --out "$dir/$name-preview.jpg" > /dev/null
              size=$(stat -f %z "$dir/$name-preview.jpg")
              chunks=$(( chunks + ((size + 2) / 3 * 4 + 3999) / 4000 ))
            done
            echo "质量 ${quality}：${chunks} 段"
            [ "$chunks" -le 40 ] && break
          done
          ls -la "$dir"
      - name: App Store screenshot annotations (1)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 1 shots/app-store-previews
      - name: App Store screenshot annotations (2)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 2 shots/app-store-previews
      - name: App Store screenshot annotations (3)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 3 shots/app-store-previews
      - name: App Store screenshot annotations (4)
        if: always() && contains(github.event.head_commit.message, '[screenshots')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 4 shots/app-store-previews

  release:
    name: Release
    needs: [core, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # 和 release.yml 用同一个 Frit 提交；升级时 uses 的 @ 后面和 frit-ref 一起改。
    uses: whrss9527/frit/.github/workflows/release-app.yml@6f27e71aab8831a9b007e6ee5b022cf19cadb0a8
    with:
      app-name: Stox
      ref: ${{ github.sha }}
      # 上面已经跑过测试。
      test-command: ""
      build-command: UNIVERSAL=1 ZIP=1 scripts/build-app.sh
      archives: dist/Stox.zip
      notes-command: scripts/release-notes.sh
      require-notarization: true
      frit-ref: 6f27e71aab8831a9b007e6ee5b022cf19cadb0a8
    secrets: inherit
