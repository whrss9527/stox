name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本号，例如 v0.1.0。留空则只构建不发布"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Live data smoke test
        # 真实请求腾讯行情接口；数据源偶尔抖动时不阻塞构建。
        continue-on-error: true
        run: |
          swift run stox-cli quote sh000001 sh600519 sz000001 sz399006 sh510300 bj920819 hk00700 hkHSI usAAPL usBRK.B us.IXIC
          swift run stox-cli search gzmt
          swift run stox-cli search 腾讯

  app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: swift test
      - name: Build Stox.app (universal)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 手动发布时用输入的版本号；推送 v* 标签时由脚本从标签读取。
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::版本号格式应为 v主版本.次版本.修订号，例如 v0.1.0"
              exit 1
            fi
            export VERSION="${RELEASE_TAG#v}"
          fi
          UNIVERSAL=1 ./scripts/build-app.sh
      - name: Inspect bundle
        run: |
          plutil -p dist/Stox.app/Contents/Info.plist
          ls -la dist/Stox.app/Contents/MacOS dist/Stox.app/Contents/Resources
      - name: Launch smoke test
        # 真正启动打包好的 App：启动后不能崩溃；同时打开面板截图，供检查界面。
        run: |
          mkdir -p shots
          run_case() {
            local name="$1"
            shift
            ./dist/Stox.app/Contents/MacOS/Stox "$@" > "shots/$name.log" 2>&1 &
            local pid=$!
            sleep 14
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Stox exited during launch ($name)"
              cat "shots/$name.log"
              ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
              exit 1
            fi
            {
              echo "STOX_DIAG rss_kb=$(ps -o rss= -p "$pid" | tr -d ' ')"
              echo "STOX_DIAG $(vmmap -summary "$pid" 2>/dev/null | grep -m1 'Physical footprint:' | tr -s ' ')"
            } > "shots/$name-memory.log"
            grep -h STOX_DIAG "shots/$name.log" "shots/$name-memory.log" || true
            screencapture -x "shots/$name-full.png" || echo "screencapture failed"
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          }
          run_case panel --show-panel
          run_case detail --show-panel --expand sh600519
          run_case search --show-panel --search 腾讯
          run_case settings --show-settings
      - name: Crop screenshots
        continue-on-error: true
        run: |
          for name in panel detail search settings; do
            frame=$(grep -o 'capture_frame=[0-9 -]*' "shots/$name.log" | head -1 | cut -d= -f2)
            if [ -n "$frame" ] && [ -f "shots/$name-full.png" ]; then
              swift scripts/ci-screenshot.swift "shots/$name-full.png" "shots/$name.jpg" $frame 900 0.85
              swift scripts/ci-screenshot.swift "shots/$name-full.png" "shots/$name-preview.jpg" $frame 640 0.45
            fi
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      # 提交信息里带 [screenshots] 时，把诊断信息和截图以注释形式发布，
      # 方便在无法下载构建产物的环境里通过 API 取回查看。
      - name: Diagnostics as annotations
        if: contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: |
          grep -h "status_title\|rss_kb\|footprint" shots/*.log | head -9 | while read -r line; do
            echo "::notice title=diag::$line"
          done
      - name: Screenshot annotations (1)
        if: contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 1
      - name: Screenshot annotations (2)
        if: contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 2
      - name: Screenshot annotations (3)
        if: contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 3
      - name: Screenshot annotations (4)
        if: contains(github.event.head_commit.message, '[screenshots]')
        continue-on-error: true
        run: scripts/ci-annotate-image.sh 4
      - name: Live data smoke test
        continue-on-error: true
        run: swift run -c release stox-cli quote sh600519 hk00700 usAAPL us.IXIC
      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Stox.app Stox.zip
          shasum -a 256 Stox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stox-app
          path: dist/Stox.zip
      - name: Publish release
        # 两种发布方式：推送 v* 标签；或在 Actions 页面手动运行 build 并填写版本号，
        # 这时由 CI 在当前提交上创建标签。已存在同名 release 时只上传或替换安装包。
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Stox.zip --clobber
          else
            gh release create "$TAG" dist/Stox.zip \
              --target "$GITHUB_SHA" \
              --title "Stox $TAG" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
